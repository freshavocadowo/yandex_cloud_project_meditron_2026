[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statchem"
version = "0.1.0"
description = "Evidence-backed extraction from synthetic cardiology discharge summaries"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pydantic==2.12.3", "pydantic-settings==2.11.0", "jsonschema==4.25.1",
  "typer==0.20.0", "openai==2.3.0", "streamlit==1.50.0",
  "natasha==1.6.0", "markdown-it-py==4.0.0", "razdel==0.5.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
statchem = "statchem.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
statchem = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
